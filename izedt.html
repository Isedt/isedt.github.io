<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>izedt MCSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Estilos para la pantalla de protección */
    #preScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #030712; /* gray-950 */
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    canvas {
      border: 2px dashed #4f46e5;
      border-radius: 1rem;
      background-color: #111827;
      cursor: crosshair;
      touch-action: none; /* Evita que la pantalla haga scroll al dibujar en móvil */
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 overflow-hidden" id="bodyContainer">

  <!-- PANTALLA DE PROTECCIÓN CONTRA BOTS -->
  <div id="preScreen">
    <div class="text-center mb-6 px-4">
      <h2 class="text-2xl font-bold text-indigo-400 uppercase tracking-widest mb-2">Verificación de Humano</h2>
      <p class="text-gray-400 text-sm">Dibuja cualquier garabato en el recuadro para desbloquear el panel.</p>
    </div>
    <canvas id="unlockCanvas" width="300" height="200"></canvas>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div class="min-h-screen flex items-center justify-center p-4 font-sans opacity-0 transition-opacity duration-1000" id="mainPanel">
    <div class="max-w-md w-full bg-gray-900 rounded-2xl shadow-[0_0_50px_rgba(79,70,229,0.15)] border border-gray-800 overflow-hidden">
      
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-center">
        <h1 class="text-4xl font-extrabold tracking-widest text-white drop-shadow-md">
          izedt MCSV
        </h1>
        <p class="text-indigo-200 mt-2 text-sm font-medium uppercase tracking-wide">CTM ANCLA</p>
      </div>

      <div class="p-8">
        <form id="launcherForm" class="space-y-6">
          
          <div>
            <label class="block text-sm font-bold mb-2 text-gray-400 uppercase tracking-wider" for="lambdaId">ID</label>
            <input 
              type="text" 
              id="lambdaId" 
              placeholder="jAvpTo..." 
              class="w-full px-5 py-4 bg-gray-950 border border-gray-700 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-gray-100 placeholder-gray-600 shadow-inner"
              required
            >
          </div>

          <div>
            <label class="block text-sm font-bold mb-2 text-gray-400 uppercase tracking-wider">Servidor</label>
            
            <div class="relative flex items-center bg-gray-950 border border-gray-700 rounded-xl overflow-hidden shadow-inner focus-within:ring-2 focus-within:ring-indigo-500 transition-all">
              
              <button type="button" id="prevBtn" class="absolute left-0 z-10 p-4 text-gray-400 hover:text-indigo-400 transition-colors bg-gradient-to-r from-gray-950 to-transparent focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
              </button>

              <div id="carouselContainer" class="flex w-full overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar">
                <div class="w-full shrink-0 snap-center flex items-center justify-center py-4 text-xl font-bold text-gray-100 select-none">ATM11</div>
                <div class="w-full shrink-0 snap-center flex items-center justify-center py-4 text-xl font-bold text-gray-100 select-none">DavidCustom</div>
                <div class="w-full shrink-0 snap-center flex items-center justify-center py-4 text-xl font-bold text-gray-100 select-none">SkyBlockH</div>
                <div class="w-full shrink-0 snap-center flex items-center justify-center py-4 text-xl font-bold text-gray-100 select-none">Vanilla</div>
              </div>

              <button type="button" id="nextBtn" class="absolute right-0 z-10 p-4 text-gray-400 hover:text-indigo-400 transition-colors bg-gradient-to-l from-gray-950 to-transparent focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>
            
            <input type="hidden" id="modpackSelect" value="ATM11">
          </div>
          
          <div>
            <label class="block text-sm font-bold mb-2 text-gray-400 uppercase tracking-wider" for="seNoHomo">NoHomo secreto</label>
            <input 
              type="password" 
              id="seNoHomo" 
              placeholder="••••••••••••" 
              class="w-full px-5 py-4 bg-gray-950 border border-gray-700 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-100 placeholder-gray-600 shadow-inner"
              required
            >
          </div>
          
          <div class="flex flex-col space-y-3 mt-4">
            <button 
              type="submit" 
              class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-black text-xl py-5 px-6 rounded-xl shadow-[0_10px_20px_rgba(79,70,229,0.3)] transform transition-all duration-200 hover:-translate-y-1 active:translate-y-1 uppercase tracking-widest"
            >
              Iniciar Servidor
            </button>
            
            <button 
              type="button" 
              id="shutdownBtn"
              class="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-black text-lg py-4 px-6 rounded-xl shadow-[0_10px_20px_rgba(225,29,72,0.3)] transform transition-all duration-200 hover:-translate-y-1 active:translate-y-1 uppercase tracking-widest border border-red-500"
            >
              Apagar Todo
            </button>
          </div>
        </form>

        <div id="statusBox" class="mt-6 hidden rounded-xl p-4 text-center border">
          <p id="statusMsg" class="text-base font-bold"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================
       1. PROTECCIÓN CONTRA CRAWLERS (CANVAS CORREGIDO)
       ========================================= */
    const canvas = document.getElementById('unlockCanvas');
    const ctx = canvas.getContext('2d');
    const preScreen = document.getElementById('preScreen');
    const mainPanel = document.getElementById('mainPanel');
    const bodyContainer = document.getElementById('bodyContainer');
    
    let isDrawing = false;
    let drawPoints = 0;
    const requiredPoints = 25; // Cantidad de trazo requerida

    // Función para obtener las coordenadas exactas
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      e.preventDefault(); // Evita scroll en móviles
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      
      const pos = getPos(e);
      
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#a855f7'; // purple-500
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      drawPoints++;

      if (drawPoints > requiredPoints) {
        isDrawing = false;
        preScreen.style.opacity = '0';
        setTimeout(() => {
          preScreen.style.display = 'none';
          mainPanel.classList.remove('opacity-0');
          bodyContainer.classList.remove('overflow-hidden');
        }, 800);
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseleave', stopDrawing);
    
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', draw, { passive: false });


    /* =========================================
       2. CARRUSEL INFINITO
       ========================================= */
    const container = document.getElementById('carouselContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const hiddenInput = document.getElementById('modpackSelect');
    
    const servers = ['ATM11', 'DavidCustom', 'SkyBlockH', 'Vanilla'];
    let currentIndex = 0;

    function updateCarousel() {
      container.scrollTo({ left: currentIndex * container.clientWidth, behavior: 'smooth' });
      hiddenInput.value = servers[currentIndex];
    }

    prevBtn.addEventListener('click', () => {
      currentIndex--;
      if (currentIndex < 0) {
        currentIndex = servers.length - 1; // Bucle al final
      }
      updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex >= servers.length) {
        currentIndex = 0; // Bucle al inicio
      }
      updateCarousel();
    });

    container.addEventListener('scroll', () => {
      const scrollIndex = Math.round(container.scrollLeft / container.clientWidth);
      if (scrollIndex !== currentIndex && servers[scrollIndex]) {
        currentIndex = scrollIndex;
        hiddenInput.value = servers[currentIndex];
      }
    });


    /* =========================================
       3. PETICIONES A AWS (START / STOP)
       ========================================= */
    const statusBox = document.getElementById('statusBox');
    const statusMsg = document.getElementById('statusMsg');

    async function sendAwsCommand(actionType) {
      const secretitoNohomo = document.getElementById('lambdaId').value.trim();
      const NoHomoInput = document.getElementById('seNoHomo').value.trim();
      const modpackInput = document.getElementById('modpackSelect').value;

      if (!secretitoNohomo || !NoHomoInput) {
        alert("Por favor ingresa tu ID y el NoHomo secreto.");
        return;
      }

      const lambdaUrl = `https://${secretitoNohomo}.lambda-url.us-east-2.on.aws/`;

      statusBox.classList.remove('hidden', 'bg-green-900/50', 'border-green-500', 'bg-red-900/50', 'border-red-500');
      statusBox.classList.add('bg-yellow-900/50', 'border-yellow-500', 'animate-pulse');
      statusMsg.className = "text-yellow-400 font-bold";
      statusMsg.textContent = actionType === 'start' ? "CONECTANDO CON AWS..." : "ENVIANDO SEÑAL DE APAGADO...";

      const payload = actionType === 'start' 
        ? { action: "start", modpack: modpackInput, token: NoHomoInput }
        : { action: "stop", token: NoHomoInput };

      try {
        const response = await fetch(lambdaUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusBox.classList.remove('animate-pulse', 'bg-yellow-900/50', 'border-yellow-500');

        if (response.ok) {
          statusBox.classList.add('bg-green-900/50', 'border-green-500');
          statusMsg.className = "text-green-400 font-bold uppercase tracking-wide";
          statusMsg.textContent = actionType === 'start' 
            ? `¡SEÑAL ENVIADA PARA ${modpackInput}!` 
            : "¡SISTEMA APAGÁNDOSE!";
          document.getElementById('seNoHomo').value = '';
        } else {
          statusBox.classList.add('bg-red-900/50', 'border-red-500');
          statusMsg.className = "text-red-400 font-bold uppercase tracking-wide";
          statusMsg.textContent = "ACCESO DENEGADO";
        }
      } catch (error) {
        statusBox.classList.remove('animate-pulse', 'bg-yellow-900/50', 'border-yellow-500');
        statusBox.classList.add('bg-red-900/50', 'border-red-500');
        statusMsg.className = "text-red-400 font-bold uppercase tracking-wide";
        statusMsg.textContent = "ERROR DE CONEXIÓN O ID INVÁLIDO";
      }
    }

    document.getElementById('launcherForm').addEventListener('submit', (e) => {
      e.preventDefault();
      sendAwsCommand('start');
    });

    document.getElementById('shutdownBtn').addEventListener('click', () => {
      sendAwsCommand('stop');
    });
  </script>
</body>
</html>
